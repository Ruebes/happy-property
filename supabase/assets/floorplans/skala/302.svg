<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <pattern id="hpHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4efe4"/><line x1="546.0" y1="0" x2="546.0" y2="8" stroke="#d9cfba" stroke-width="1.4"/>
    </pattern>
    <pattern id="hpTiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#fdeee9"/><path d="M26 0H0V26" fill="none" stroke="#f5c9bc" stroke-width="1"/>
    </pattern>
    <pattern id="hpSlats" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f4efe4"/><line x1="0" y1="5" x2="10" y2="5" stroke="#ddd3bf" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="900" fill="#FAF6EC"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#1a2332" font-family="Playfair Display, Georgia, serif">Apartment 302</text>
  <text x="60" y="66" font-size="13" fill="#6b7280">2 Schlafzimmer · 80 m² Wohnfläche · Terrasse 66 m² (17 m² überdacht) · 3. Ebene</text>

  <!-- Bodenflächen -->
  <rect x="230" y="112" width="211" height="473" fill="#fbf8f1"/>
  <rect x="230" y="585" width="211" height="92" fill="url(#hpTiles)"/>
  <rect x="230" y="677" width="211" height="100" fill="url(#hpSlats)"/>

  <!-- ── Außenwände ── -->
  <!-- Nord -->
  <line x1="230" y1="112" x2="441" y2="112" stroke="#1b1b22" stroke-width="9"/>
  <!-- West mit Fenstern (SZ1, SZ2, Bad 2, Essen) -->
  <line x1="230" y1="112" x2="230" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <line x1="230" y1="130" x2="230" y2="200" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="230" y1="130" x2="230" y2="200" stroke="#ffffff" stroke-width="3"/>
  <line x1="230" y1="200" x2="230" y2="270" stroke="#1b1b22" stroke-width="9"/>
  <line x1="230" y1="270" x2="230" y2="340" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="230" y1="270" x2="230" y2="340" stroke="#ffffff" stroke-width="3"/>
  <line x1="230" y1="340" x2="230" y2="362" stroke="#1b1b22" stroke-width="9"/>
  <line x1="230" y1="362" x2="230" y2="400" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="230" y1="362" x2="230" y2="400" stroke="#ffffff" stroke-width="3"/>
  <line x1="230" y1="400" x2="230" y2="470" stroke="#1b1b22" stroke-width="9"/>
  <line x1="230" y1="470" x2="230" y2="556" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="230" y1="470" x2="230" y2="556" stroke="#ffffff" stroke-width="3"/>
  <line x1="230" y1="556" x2="230" y2="585" stroke="#1b1b22" stroke-width="9"/>
  <!-- Ost: Kern-/Nachbarseite mit Eingangsöffnung -->
  <line x1="441" y1="112" x2="441" y2="228" stroke="#1b1b22" stroke-width="9"/>
  <line x1="441" y1="266" x2="441" y2="585" stroke="#1b1b22" stroke-width="9"/>
  <!-- Süd: Glasschiebefront zur Veranda -->
  <line x1="230" y1="585" x2="246" y2="585" stroke="#1b1b22" stroke-width="4"/>
  <line x1="246" y1="585" x2="424" y2="585" stroke="#8fb3cf" stroke-width="5"/>
  <line x1="246" y1="585" x2="424" y2="585" stroke="#ffffff" stroke-width="3"/>
  <line x1="424" y1="585" x2="441" y2="585" stroke="#1b1b22" stroke-width="4"/>
  <!-- Veranda-/Terrassenraender -->
  <line x1="230" y1="585" x2="230" y2="777" stroke="#1b1b22" stroke-width="4"/>
  <line x1="441" y1="585" x2="441" y2="777" stroke="#1b1b22" stroke-width="4"/>
  <line x1="230" y1="677" x2="441" y2="677" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="230" y1="777" x2="441" y2="777" stroke="#1b1b22" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- ── Innenwände ── -->
  <!-- SZ1: Südwand (mit Tür im Osten) + Schrankwand + Bad 1 -->
  <line x1="230" y1="224" x2="330" y2="224" stroke="#1b1b22" stroke-width="4"/>
  <line x1="345" y1="112" x2="345" y2="224" stroke="#1b1b22" stroke-width="4"/>
  <line x1="387" y1="112" x2="387" y2="187" stroke="#1b1b22" stroke-width="4"/>
  <line x1="345" y1="187" x2="404" y2="187" stroke="#1b1b22" stroke-width="4"/>
  <!-- Flurband: Sued des Flurs = Nordwand SZ2 (Tuer im Osten) -->
  <line x1="230" y1="256" x2="316" y2="256" stroke="#1b1b22" stroke-width="4"/>
  <line x1="354" y1="256" x2="441" y2="256" stroke="#1b1b22" stroke-width="4"/>
  <!-- SZ2: Suedwand (Tuer Ost) + Schrankwand -->
  <line x1="230" y1="355" x2="300" y2="355" stroke="#1b1b22" stroke-width="4"/>
  <line x1="338" y1="355" x2="390" y2="355" stroke="#1b1b22" stroke-width="4"/>
  <line x1="390" y1="256" x2="390" y2="355" stroke="#1b1b22" stroke-width="4"/>
  <!-- Bad 2 + Abstell: Ostwand + Suedwand -->
  <line x1="310" y1="355" x2="310" y2="371" stroke="#1b1b22" stroke-width="4"/>
  <line x1="310" y1="403" x2="310" y2="409" stroke="#1b1b22" stroke-width="4"/>
  <line x1="230" y1="409" x2="330" y2="409" stroke="#1b1b22" stroke-width="4"/>
  <line x1="330" y1="355" x2="330" y2="409" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Türen ── -->
  <!-- Eingang (Ostwand, Flurband): öffnet in den Flur -->
  <line x1="441" y1="266" x2="403" y2="266" stroke="#1b1b22" stroke-width="3"/>
  <path d="M441 228 A38 38 0 0 0 403 266" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- SZ1-Tür (Südwand, öffnet ins Zimmer) -->
  <line x1="330" y1="224" x2="330" y2="190" stroke="#1b1b22" stroke-width="3"/>
  <path d="M330 190 A34 34 0 0 0 296 224" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-1-Tür (Südwand des Bads, öffnet ins Bad) -->
  <line x1="404" y1="187" x2="404" y2="155" stroke="#1b1b22" stroke-width="3"/>
  <path d="M436 187 A32 32 0 0 0 404 155" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- SZ2-Tür (Nordwand, öffnet ins Zimmer) -->
  <line x1="316" y1="256" x2="316" y2="292" stroke="#1b1b22" stroke-width="3"/>
  <path d="M316 292 A38 38 0 0 1 354 256" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-2-Tür (Ostwand zum Gang, öffnet ins Bad) -->
  <line x1="310" y1="371" x2="280" y2="371" stroke="#1b1b22" stroke-width="3"/>
  <path d="M310 403 A32 32 0 0 0 278 371" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>

  <!-- ── Möbel ── -->
  <!-- SZ1: Bett West + Schrank Ost (Hatch) -->
  <rect x="236" y="126" width="88" height="62" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="252" y1="126" x2="252" y2="188" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="239" y="132" width="11" height="20" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="239" y="158" width="11" height="20" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="350" y="120" width="32" height="60" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Bad 1: WC + Waschtisch -->
  <ellipse cx="414" cy="132" rx="8" ry="7" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="414" cy="166" rx="8" ry="7" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- SZ2: Bett West + Schrank Ost -->
  <rect x="236" y="270" width="88" height="62" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="252" y1="270" x2="252" y2="332" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="239" y="276" width="11" height="20" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="239" y="302" width="11" height="20" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="352" y="262" width="34" height="56" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Bad 2: Waschtisch + WC | Abstell -->
  <ellipse cx="256" cy="382" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="290" cy="382" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Küche: Zeile unterm Bad-Band (Westwand) -->
  <rect x="234" y="414" width="120" height="22" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <circle cx="250" cy="425" r="6" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <rect x="300" y="417" width="22" height="15" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <!-- Essen: Tisch + 6 Stühle (West) -->
  <rect x="248" y="480" width="48" height="66" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="240" cy="494" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="240" cy="532" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="304" cy="494" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="304" cy="532" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="272" cy="470" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="272" cy="556" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Wohnen: Sofa (Ost) + Couchtisch -->
  <rect x="404" y="470" width="26" height="84" rx="4" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <rect x="352" y="500" width="34" height="30" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <!-- Veranda: Sitzgruppe -->
  <rect x="304" y="614" width="32" height="32" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="288" cy="620" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="288" cy="646" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="352" cy="620" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="352" cy="646" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>

  <!-- ── Raum-Labels + Maße ── -->
  <text x="288" y="204" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN 1</text>
  <text x="288" y="218" font-size="10" fill="#9ca3af" text-anchor="middle">3,60 × 3,50 m</text>
  <text x="412" y="200" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="288" y="346" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN 2</text>
  <text x="240" y="368" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="336" y="402" font-size="9.5" fill="#1a2332" font-weight="600">ABSTELL</text>
  <text x="264" y="452" font-size="12" fill="#1a2332" font-weight="600">KÜCHE</text>
  <text x="272" y="468" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">ESSEN</text>
  <text x="382" y="530" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">WOHNEN</text>
  <text x="336" y="577" font-size="10" fill="#9ca3af" text-anchor="middle">offener Bereich · 5,45 m</text>
  <text x="336" y="666" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">VERANDA · 17 m² · überdacht</text>
  <text x="336" y="746" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">TERRASSE · 49 m² · offen</text>

  <!-- Eingang-Pill -->
  <rect x="458" y="236" width="82" height="22" rx="11" fill="#ff795d"/>
  <text x="499" y="251" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">EINGANG</text>

  <!-- Footer -->
  <text x="60" y="856" font-size="11" fill="#9ca3af">Grundriss nach Originalplan (Luma Developers, Maßstab 1:100) · Möblierung beispielhaft · Maße ca.</text>
  <text x="60" y="874" font-size="11" fill="#9ca3af">Skala · Apartment 302 · Wohnfläche 80 m² + Terrasse 66 m²</text>
</svg>
