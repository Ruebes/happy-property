<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <pattern id="hpHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4efe4"/><line x1="546.0" y1="0" x2="546.0" y2="8" stroke="#d9cfba" stroke-width="1.4"/>
    </pattern>
    <pattern id="hpTiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#fdeee9"/><path d="M26 0H0V26" fill="none" stroke="#f5c9bc" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="900" fill="#FAF6EC"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#1a2332" font-family="Playfair Display, Georgia, serif">Apartment 103</text>
  <text x="60" y="66" font-size="13" fill="#6b7280">1 Schlafzimmer · 50 m² Wohnfläche · Veranda 10 m² · 1. Ebene</text>

  <!-- Bodenflächen -->
  <rect x="250" y="130" width="233" height="387" fill="#fbf8f1"/>
  <!-- Veranda (Weststreifen auf Höhe des Wohnbereichs) -->
  <rect x="175" y="286" width="75" height="209" fill="url(#hpTiles)"/>

  <!-- ── Außenwände ── -->
  <!-- Nord mit Fenstern (Schlafzimmer + Bad) -->
  <line x1="250" y1="130" x2="268" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <line x1="268" y1="130" x2="366" y2="130" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="268" y1="130" x2="366" y2="130" stroke="#ffffff" stroke-width="3"/>
  <line x1="366" y1="130" x2="428" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <line x1="428" y1="130" x2="468" y2="130" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="428" y1="130" x2="468" y2="130" stroke="#ffffff" stroke-width="3"/>
  <line x1="468" y1="130" x2="483" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <!-- West: oben Wand (Schlafzimmer), unten Glasfront zur Veranda -->
  <line x1="250" y1="130" x2="250" y2="298" stroke="#1b1b22" stroke-width="9"/>
  <line x1="250" y1="298" x2="250" y2="482" stroke="#8fb3cf" stroke-width="5"/>
  <line x1="250" y1="298" x2="250" y2="482" stroke="#ffffff" stroke-width="3"/>
  <line x1="250" y1="482" x2="250" y2="517" stroke="#1b1b22" stroke-width="9"/>
  <!-- Ost mit Eingangsöffnung -->
  <line x1="483" y1="130" x2="483" y2="296" stroke="#1b1b22" stroke-width="9"/>
  <line x1="483" y1="334" x2="483" y2="517" stroke="#1b1b22" stroke-width="9"/>
  <!-- Süd (Trennwand zu Apartment 102, fensterlos) -->
  <line x1="250" y1="517" x2="483" y2="517" stroke="#1b1b22" stroke-width="9"/>
  <!-- Veranda-Ränder -->
  <line x1="250" y1="286" x2="175" y2="286" stroke="#1b1b22" stroke-width="4"/>
  <line x1="175" y1="286" x2="175" y2="495" stroke="#1b1b22" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="175" y1="495" x2="250" y2="495" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Innenwände ── -->
  <!-- Schlafzimmer: Südwand mit Tür (Osten) -->
  <line x1="250" y1="286" x2="379" y2="286" stroke="#1b1b22" stroke-width="4"/>
  <!-- Schlafzimmer/Bad-Spalte: Trennwand -->
  <line x1="417" y1="130" x2="417" y2="286" stroke="#1b1b22" stroke-width="4"/>
  <!-- Bad: Südwand mit Tür + La darunter -->
  <line x1="417" y1="236" x2="430" y2="236" stroke="#1b1b22" stroke-width="4"/>
  <line x1="462" y1="236" x2="483" y2="236" stroke="#1b1b22" stroke-width="4"/>
  <!-- Abstell (La): Südwand -->
  <line x1="417" y1="286" x2="483" y2="286" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Türen ── -->
  <!-- Eingang (Ostwand): öffnet in den kleinen Flur -->
  <line x1="483" y1="334" x2="445" y2="334" stroke="#1b1b22" stroke-width="3"/>
  <path d="M483 296 A38 38 0 0 0 445 334" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Schlafzimmer-Tür (Südwand Ost-Ende, öffnet ins Zimmer) -->
  <line x1="379" y1="286" x2="379" y2="250" stroke="#1b1b22" stroke-width="3"/>
  <path d="M379 250 A36 36 0 0 1 415 286" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-Tür (Südwand des Bads, öffnet ins Bad) -->
  <line x1="430" y1="236" x2="430" y2="204" stroke="#1b1b22" stroke-width="3"/>
  <path d="M430 204 A32 32 0 0 1 462 236" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>

  <!-- ── Möbel ── -->
  <!-- Schlafzimmer: Doppelbett Westwand + Schrank -->
  <rect x="256" y="158" width="96" height="70" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="274" y1="158" x2="274" y2="228" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="259" y="166" width="12" height="24" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="259" y="196" width="12" height="24" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="368" y="136" width="44" height="22" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Bad: Waschtisch + WC -->
  <ellipse cx="446" cy="160" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="446" cy="204" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Abstell (Hatch) -->
  <rect x="421" y="242" width="58" height="40" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.2"/>
  <!-- Wohnen: Sofa + Sessel -->
  <rect x="268" y="330" width="70" height="26" rx="4" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="366" cy="346" r="14" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <!-- Küche: Zeile an der Südwand -->
  <rect x="254" y="490" width="136" height="22" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <circle cx="272" cy="501" r="6" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <rect x="340" y="493" width="22" height="15" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <!-- Essen: runder Tisch + 4 Stühle (Südost) -->
  <circle cx="432" cy="440" r="22" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="432" cy="408" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="432" cy="472" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="400" cy="440" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="464" cy="440" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Veranda: zwei Stühle + Tischchen -->
  <circle cx="212" cy="350" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="212" cy="410" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <rect x="199" y="368" width="26" height="26" fill="none" stroke="#c9bfa9" stroke-width="2"/>

  <!-- ── Raum-Labels + Maße ── -->
  <text x="322" y="256" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN</text>
  <text x="322" y="270" font-size="10" fill="#9ca3af" text-anchor="middle">3,80 × 3,55 m</text>
  <text x="437" y="186" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="450" y="266" font-size="9.5" fill="#1a2332" font-weight="600" text-anchor="middle">ABSTELL</text>
  <text x="316" y="392" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">WOHNEN</text>
  <text x="316" y="406" font-size="10" fill="#9ca3af" text-anchor="middle">4,40 × 4,75 m</text>
  <text x="300" y="480" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">KÜCHE</text>
  <text x="432" y="500" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">ESSEN</text>
  <text x="212" y="474" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">VERANDA</text>
  <text x="212" y="488" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">10 m²</text>

  <!-- Eingang-Pill -->
  <rect x="500" y="304" width="82" height="22" rx="11" fill="#ff795d"/>
  <text x="541" y="319" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">EINGANG</text>

  <!-- Footer -->
  <text x="60" y="856" font-size="11" fill="#9ca3af">Grundriss nach Originalplan (Luma Developers, Maßstab 1:100) · Möblierung beispielhaft · Maße ca.</text>
  <text x="60" y="874" font-size="11" fill="#9ca3af">Skala · Apartment 103 · Wohnfläche 50 m² + Veranda 10 m²</text>
</svg>
