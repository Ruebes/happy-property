<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <pattern id="hpHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4efe4"/><line x1="546.0" y1="0" x2="546.0" y2="8" stroke="#d9cfba" stroke-width="1.4"/>
    </pattern>
    <pattern id="hpTiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#fdeee9"/><path d="M26 0H0V26" fill="none" stroke="#f5c9bc" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="900" fill="#FAF6EC"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#1a2332" font-family="Playfair Display, Georgia, serif">Apartment 102</text>
  <text x="60" y="66" font-size="13" fill="#6b7280">2 Schlafzimmer · 81,5 m² Wohnfläche · Terrasse 28 m² · 1. Ebene</text>

  <!-- Bodenflächen -->
  <rect x="200" y="130" width="288" height="418" fill="#fbf8f1"/>
  <!-- Veranda (L-Form: West flacher, Ost tiefer) -->
  <rect x="200" y="548" width="137" height="58" fill="url(#hpTiles)"/>
  <rect x="337" y="548" width="151" height="104" fill="url(#hpTiles)"/>

  <!-- ── Außenwände ── -->
  <!-- Nord mit Eingangsöffnung (rechts der Zimmerspalte) -->
  <line x1="200" y1="130" x2="336" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <line x1="374" y1="130" x2="488" y2="130" stroke="#1b1b22" stroke-width="9"/>
  <!-- West mit Fenstern (SZ1, Bad 1, Bad 2, SZ2) -->
  <line x1="200" y1="130" x2="200" y2="152" stroke="#1b1b22" stroke-width="9"/>
  <line x1="200" y1="152" x2="200" y2="222" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="200" y1="152" x2="200" y2="222" stroke="#ffffff" stroke-width="3"/>
  <line x1="200" y1="222" x2="200" y2="252" stroke="#1b1b22" stroke-width="9"/>
  <line x1="200" y1="252" x2="200" y2="284" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="200" y1="252" x2="200" y2="284" stroke="#ffffff" stroke-width="3"/>
  <line x1="200" y1="284" x2="200" y2="308" stroke="#1b1b22" stroke-width="9"/>
  <line x1="200" y1="308" x2="200" y2="340" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="200" y1="308" x2="200" y2="340" stroke="#ffffff" stroke-width="3"/>
  <line x1="200" y1="340" x2="200" y2="412" stroke="#1b1b22" stroke-width="9"/>
  <line x1="200" y1="412" x2="200" y2="482" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="200" y1="412" x2="200" y2="482" stroke="#ffffff" stroke-width="3"/>
  <line x1="200" y1="482" x2="200" y2="548" stroke="#1b1b22" stroke-width="9"/>
  <!-- Ost: Trennwand zu Apartment 101 (fensterlos) -->
  <line x1="488" y1="130" x2="488" y2="548" stroke="#1b1b22" stroke-width="9"/>
  <!-- Süd: SZ2 Glasfront (West) + Wohnen Glasfront (Ost) -->
  <line x1="200" y1="548" x2="212" y2="548" stroke="#1b1b22" stroke-width="4"/>
  <line x1="212" y1="548" x2="326" y2="548" stroke="#8fb3cf" stroke-width="5"/>
  <line x1="212" y1="548" x2="326" y2="548" stroke="#ffffff" stroke-width="3"/>
  <line x1="326" y1="548" x2="350" y2="548" stroke="#1b1b22" stroke-width="4"/>
  <line x1="350" y1="548" x2="472" y2="548" stroke="#8fb3cf" stroke-width="5"/>
  <line x1="350" y1="548" x2="472" y2="548" stroke="#ffffff" stroke-width="3"/>
  <line x1="472" y1="548" x2="488" y2="548" stroke="#1b1b22" stroke-width="4"/>
  <!-- Veranda-Ränder (gestrichelt = offene Kante) -->
  <line x1="200" y1="548" x2="200" y2="606" stroke="#1b1b22" stroke-width="4"/>
  <line x1="200" y1="606" x2="337" y2="606" stroke="#1b1b22" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="337" y1="606" x2="337" y2="652" stroke="#1b1b22" stroke-width="4"/>
  <line x1="337" y1="652" x2="488" y2="652" stroke="#1b1b22" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="488" y1="548" x2="488" y2="652" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Innenwände ── -->
  <!-- SZ1: Ostwand (zum Entree) + Südwand -->
  <line x1="335" y1="130" x2="335" y2="166" stroke="#1b1b22" stroke-width="4"/>
  <line x1="335" y1="204" x2="335" y2="242" stroke="#1b1b22" stroke-width="4"/>
  <line x1="200" y1="242" x2="335" y2="242" stroke="#1b1b22" stroke-width="4"/>
  <!-- Bad-Spalte: Ostwand mit zwei Türen + Trennwand Bad1/Bad2 + Südwand -->
  <line x1="294" y1="242" x2="294" y2="256" stroke="#1b1b22" stroke-width="4"/>
  <line x1="294" y1="288" x2="294" y2="310" stroke="#1b1b22" stroke-width="4"/>
  <line x1="294" y1="342" x2="294" y2="356" stroke="#1b1b22" stroke-width="4"/>
  <line x1="200" y1="299" x2="294" y2="299" stroke="#1b1b22" stroke-width="4"/>
  <line x1="200" y1="356" x2="294" y2="356" stroke="#1b1b22" stroke-width="4"/>
  <!-- SZ2: Nordwand (mit Tür im Osten) + Ostwand -->
  <line x1="200" y1="412" x2="299" y2="412" stroke="#1b1b22" stroke-width="4"/>
  <line x1="337" y1="412" x2="337" y2="548" stroke="#1b1b22" stroke-width="4"/>
  <!-- Entree/Küche: Trennwand Zimmerspalte zum Wohnbereich (oben) -->

  <!-- ── Türen ── -->
  <!-- Eingang (Nordwand): öffnet ins Entree -->
  <line x1="374" y1="130" x2="374" y2="168" stroke="#1b1b22" stroke-width="3"/>
  <path d="M336 130 A38 38 0 0 0 374 168" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- SZ1-Tür (Ostwand, öffnet ins Zimmer) -->
  <line x1="335" y1="166" x2="299" y2="166" stroke="#1b1b22" stroke-width="3"/>
  <path d="M299 166 A38 38 0 0 0 335 204" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-1-Tür (Ostwand, öffnet ins Bad) -->
  <line x1="294" y1="256" x2="262" y2="256" stroke="#1b1b22" stroke-width="3"/>
  <path d="M262 256 A32 32 0 0 0 294 288" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-2-Tür (Ostwand, öffnet ins Bad) -->
  <line x1="294" y1="310" x2="262" y2="310" stroke="#1b1b22" stroke-width="3"/>
  <path d="M262 310 A32 32 0 0 0 294 342" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- SZ2-Tür (Nordwand Ost-Ende, öffnet ins Zimmer) -->
  <line x1="299" y1="412" x2="299" y2="450" stroke="#1b1b22" stroke-width="3"/>
  <path d="M299 450 A38 38 0 0 1 337 412" fill="none" stroke="#9aa1ad" stroke-width="1.5" transform=""/>

  <!-- ── Möbel ── -->
  <!-- SZ1: Bett Westwand + Schrank SO-Ecke -->
  <rect x="206" y="146" width="92" height="64" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="222" y1="146" x2="222" y2="210" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="209" y="152" width="11" height="22" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="209" y="182" width="11" height="22" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="300" y="208" width="32" height="30" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Bad 1: Waschtisch + WC -->
  <ellipse cx="226" cy="270" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="262" cy="270" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Bad 2: Waschtisch + WC -->
  <ellipse cx="226" cy="326" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="262" cy="326" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- SZ2: Bett Westwand -->
  <rect x="206" y="440" width="92" height="66" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="222" y1="440" x2="222" y2="506" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="209" y="448" width="11" height="22" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="209" y="478" width="11" height="22" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <!-- Küche: Zeile an der Nordwand + Insel -->
  <rect x="384" y="134" width="100" height="22" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <circle cx="400" cy="145" r="6" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <rect x="444" y="137" width="22" height="15" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <rect x="352" y="176" width="26" height="66" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Essen: Tisch + 6 Stühle -->
  <rect x="398" y="216" width="52" height="72" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="390" cy="232" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="390" cy="272" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="458" cy="232" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="458" cy="272" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="424" cy="208" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="424" cy="296" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Wohnen: Sofa + zwei Sessel -->
  <rect x="352" y="360" width="26" height="82" rx="4" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="420" cy="392" r="14" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <circle cx="452" cy="510" r="11" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <circle cx="418" cy="516" r="11" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <!-- Veranda Ost: Sitzgruppe -->
  <rect x="396" y="586" width="34" height="34" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="380" cy="592" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="380" cy="620" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="446" cy="592" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="446" cy="620" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <!-- Veranda West: zwei Liegestühle -->
  <rect x="232" y="562" width="22" height="34" rx="4" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <rect x="268" y="562" width="22" height="34" rx="4" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>

  <!-- ── Raum-Labels + Maße ── -->
  <text x="266" y="222" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN 1</text>
  <text x="266" y="236" font-size="10" fill="#9ca3af" text-anchor="middle">3,75 × 3,10 m</text>
  <text x="234" y="254" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="234" y="312" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="252" y="432" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN 2</text>
  <text x="252" y="446" font-size="10" fill="#9ca3af" text-anchor="middle">3,80 × 3,74 m</text>
  <text x="410" y="180" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">KÜCHE</text>
  <text x="424" y="322" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">ESSEN</text>
  <text x="412" y="466" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">WOHNEN</text>
  <text x="412" y="482" font-size="10" fill="#9ca3af" text-anchor="middle">offener Bereich · 3,90 × 7,56 m</text>
  <text x="412" y="638" font-size="11" fill="#b45309" text-anchor="middle" font-weight="600">VERANDA · 22 m²</text>

  <!-- Eingang-Pill -->
  <rect x="314" y="94" width="82" height="22" rx="11" fill="#ff795d"/>
  <text x="355" y="109" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">EINGANG</text>

  <!-- Footer -->
  <text x="60" y="856" font-size="11" fill="#9ca3af">Grundriss nach Originalplan (Luma Developers, Maßstab 1:100) · Möblierung beispielhaft · Maße ca.</text>
  <text x="60" y="874" font-size="11" fill="#9ca3af">Skala · Apartment 102 · Wohnfläche 81,5 m² + Terrasse 28 m²</text>
