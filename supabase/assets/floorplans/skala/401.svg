  <rect x="0" y="0" width="680" height="900" fill="#FAF6EC"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#1a2332" font-family="Playfair Display, Georgia, serif">Apartment 401</text>
  <text x="60" y="66" font-size="13" fill="#6b7280">2 Schlafzimmer · 82 m² Wohnfläche · Terrasse 80,5 m² inkl. Dachgarten 58 m² · 4. Ebene</text>

