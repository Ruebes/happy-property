<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <pattern id="hpHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4efe4"/><line x1="546.0" y1="0" x2="546.0" y2="8" stroke="#d9cfba" stroke-width="1.4"/>
    </pattern>
    <pattern id="hpTiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#fdeee9"/><path d="M26 0H0V26" fill="none" stroke="#f5c9bc" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="900" fill="#FAF6EC"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#1a2332" font-family="Playfair Display, Georgia, serif">Apartment 403</text>
  <text x="60" y="66" font-size="13" fill="#6b7280">1 Schlafzimmer · 50 m² Wohnfläche · Veranda 5,5 m² · 4. Ebene</text>

  <!-- Bodenflächen -->
  <rect x="240" y="140" width="252" height="386" fill="#fbf8f1"/>
  <rect x="177" y="277" width="63" height="106" fill="url(#hpTiles)"/>

  <!-- ── Außenwände ── -->
  <!-- Nord mit Fenstern (Schlafzimmer + Bad) -->
  <line x1="240" y1="140" x2="262" y2="140" stroke="#1b1b22" stroke-width="9"/>
  <line x1="262" y1="140" x2="372" y2="140" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="262" y1="140" x2="372" y2="140" stroke="#ffffff" stroke-width="3"/>
  <line x1="372" y1="140" x2="438" y2="140" stroke="#1b1b22" stroke-width="9"/>
  <line x1="438" y1="140" x2="476" y2="140" stroke="#8fb3cf" stroke-width="9"/>
  <line x1="438" y1="140" x2="476" y2="140" stroke="#ffffff" stroke-width="3"/>
  <line x1="476" y1="140" x2="492" y2="140" stroke="#1b1b22" stroke-width="9"/>
  <!-- West: oben Wand (Schlafzimmer), Glasfront zur kleinen Veranda, unten Wand -->
  <line x1="240" y1="140" x2="240" y2="286" stroke="#1b1b22" stroke-width="9"/>
  <line x1="240" y1="286" x2="240" y2="374" stroke="#8fb3cf" stroke-width="5"/>
  <line x1="240" y1="286" x2="240" y2="374" stroke="#ffffff" stroke-width="3"/>
  <line x1="240" y1="374" x2="240" y2="526" stroke="#1b1b22" stroke-width="9"/>
  <!-- Ost: Kernseite mit Eingangsöffnung (unten) -->
  <line x1="492" y1="140" x2="492" y2="388" stroke="#1b1b22" stroke-width="9"/>
  <line x1="492" y1="426" x2="492" y2="526" stroke="#1b1b22" stroke-width="9"/>
  <!-- Süd (Trennwand zur Nachbarwohnung) -->
  <line x1="240" y1="526" x2="492" y2="526" stroke="#1b1b22" stroke-width="9"/>
  <!-- Veranda-Ränder -->
  <line x1="240" y1="277" x2="177" y2="277" stroke="#1b1b22" stroke-width="4"/>
  <line x1="177" y1="277" x2="177" y2="383" stroke="#1b1b22" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="177" y1="383" x2="240" y2="383" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Innenwände ── -->
  <!-- Schlafzimmer: Südwand mit Tür (Osten) + Ostwand -->
  <line x1="240" y1="277" x2="352" y2="277" stroke="#1b1b22" stroke-width="4"/>
  <line x1="390" y1="277" x2="422" y2="277" stroke="#1b1b22" stroke-width="4"/>
  <line x1="422" y1="140" x2="422" y2="277" stroke="#1b1b22" stroke-width="4"/>
  <!-- Bad: Westwand oben schon (422) · Südwand mit Tür -->
  <line x1="422" y1="248" x2="434" y2="248" stroke="#1b1b22" stroke-width="4"/>
  <line x1="466" y1="248" x2="492" y2="248" stroke="#1b1b22" stroke-width="4"/>
  <!-- Abstell unter dem Bad -->
  <line x1="422" y1="308" x2="492" y2="308" stroke="#1b1b22" stroke-width="4"/>

  <!-- ── Türen ── -->
  <!-- Eingang (Ostwand unten): öffnet in den Wohnbereich -->
  <line x1="492" y1="426" x2="454" y2="426" stroke="#1b1b22" stroke-width="3"/>
  <path d="M492 388 A38 38 0 0 0 454 426" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Schlafzimmer-Tür (Südwand Ost-Ende, öffnet ins Zimmer) -->
  <line x1="352" y1="277" x2="352" y2="241" stroke="#1b1b22" stroke-width="3"/>
  <path d="M352 241 A36 36 0 0 1 388 277" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>
  <!-- Bad-Tür (Südwand, öffnet ins Bad) -->
  <line x1="434" y1="248" x2="434" y2="216" stroke="#1b1b22" stroke-width="3"/>
  <path d="M434 216 A32 32 0 0 1 466 248" fill="none" stroke="#9aa1ad" stroke-width="1.5"/>

  <!-- ── Möbel ── -->
  <!-- Schlafzimmer: Doppelbett Westwand + Schrank Süd -->
  <rect x="246" y="164" width="100" height="72" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <line x1="264" y1="164" x2="264" y2="236" stroke="#c9bfa9" stroke-width="1.5"/>
  <rect x="249" y="172" width="12" height="24" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="249" y="202" width="12" height="24" fill="none" stroke="#c9bfa9" stroke-width="1.2"/>
  <rect x="356" y="146" width="60" height="22" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <!-- Bad: Waschtisch + WC -->
  <ellipse cx="444" cy="170" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <ellipse cx="472" cy="204" rx="9" ry="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Abstell (Hatch) -->
  <rect x="428" y="256" width="58" height="46" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.2"/>
  <!-- Küche: Zeile an der Ostwand (vertikal) -->
  <rect x="466" y="318" width="22" height="86" fill="url(#hpHatch)" stroke="#c9bfa9" stroke-width="1.5"/>
  <circle cx="477" cy="334" r="6" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <rect x="469" y="362" width="15" height="22" fill="none" stroke="#c9bfa9" stroke-width="1.4"/>
  <!-- Wohnen: Sofa (West) + Sessel -->
  <rect x="252" y="396" width="26" height="76" rx="4" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="312" cy="480" r="12" fill="none" stroke="#c9bfa9" stroke-width="1.8"/>
  <!-- Essen: runder Tisch + 4 Stühle (Mitte) -->
  <circle cx="386" cy="440" r="22" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="386" cy="408" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="386" cy="472" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="354" cy="440" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <circle cx="418" cy="440" r="8" fill="none" stroke="#c9bfa9" stroke-width="1.6"/>
  <!-- Veranda: zwei Stühle + Tischchen -->
  <circle cx="208" cy="308" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <circle cx="208" cy="356" r="9" fill="none" stroke="#c9bfa9" stroke-width="2"/>
  <rect x="196" y="320" width="24" height="24" fill="none" stroke="#c9bfa9" stroke-width="2"/>

  <!-- ── Raum-Labels + Maße ── -->
  <text x="330" y="252" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">SCHLAFEN</text>
  <text x="330" y="266" font-size="10" fill="#9ca3af" text-anchor="middle">4,55 × 3,42 m</text>
  <text x="436" y="196" font-size="10.5" fill="#1a2332" font-weight="600">BAD</text>
  <text x="457" y="284" font-size="9.5" fill="#1a2332" font-weight="600" text-anchor="middle">ABSTELL</text>
  <text x="330" y="330" font-size="12" fill="#1a2332" font-weight="600" text-anchor="middle">WOHNEN · ESSEN</text>
  <text x="330" y="344" font-size="10" fill="#9ca3af" text-anchor="middle">offener Bereich · 6,15 × 3,72 m</text>
  <text x="428" y="500" font-size="12" fill="#1a2332" font-weight="600">KÜCHE</text>
  <text x="208" y="404" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">VERANDA</text>
  <text x="208" y="418" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">5,5 m²</text>

  <!-- Eingang-Pill -->
  <rect x="508" y="396" width="82" height="22" rx="11" fill="#ff795d"/>
  <text x="549" y="411" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">EINGANG</text>

  <!-- Footer -->
  <text x="60" y="856" font-size="11" fill="#9ca3af">Grundriss nach Originalplan (Luma Developers, Maßstab 1:100) · Möblierung beispielhaft · Maße ca.</text>
  <text x="60" y="874" font-size="11" fill="#9ca3af">Skala · Apartment 403 · Wohnfläche 50 m² + Veranda 5,5 m²</text>
</svg>
