# Supabase-Projektkonfiguration.
# WICHTIG: Externe Provider-Webhooks (Timelines/Calendly/Typeform) können KEINEN
# Supabase-JWT mitschicken → sie MÜSSEN verify_jwt = false haben, sonst weist das
# Gateway sie mit 401 ab (Function läuft nie an). Ein `supabase functions deploy`
# OHNE --no-verify-jwt setzt verify_jwt sonst auf true zurück und bricht den Webhook.
# Diese Einträge sorgen dafür, dass jeder Deploy die Endpunkte öffentlich hält.
project_id = "vjlwgajmtqlwjjreowbu"

[functions.timelines-webhook]
verify_jwt = false

# Eigener WhatsApp-Server (Evolution API): abgesichert ueber x-webhook-secret.
[functions.evolution-webhook]
verify_jwt = false

[functions.calendly-webhook]
verify_jwt = false

[functions.typeform-webhook]
verify_jwt = false

# Öffentliches Tracking (Deck/Rechnung-Aufrufe + Mail-Öffnungs-Pixel) — wird ohne
# Login/JWT von öffentlichen Seiten und aus E-Mails heraus aufgerufen.
[functions.track-engagement]
verify_jwt = false

# Termin-Bot: wird server-zu-server aus track-engagement / schedule-message /
# timelines-webhook aufgerufen (Service-Role, kein User-JWT).
[functions.booking-bot]
verify_jwt = false

# Bewertungs-API: öffentlicher Fragebogen (/bewertung/:token) + Website-Widget
# (public_list wird ohne Login von happy-property.de abgerufen).
[functions.review-api]
verify_jwt = false

# Tippgeber-Programm: Cron-Scan (Provision erhalten → Abrechnung) kommt ohne JWT.
[functions.affiliate-api]
verify_jwt = false

# Eigentümerportal-Kette: Cron ruft mit Service-Role-Bearer (kein Gateway-JWT),
# der Portal-Bug-Report kommt mit User-JWT, den die Function selbst prüft.
# In-Code-Guards vorhanden (Audit 28.08.2026) — Gateway muss offen bleiben,
# damit ein Deploy ohne --no-verify-jwt die Crons nicht stilllegt.
[functions.owner-content]
verify_jwt = false

[functions.create-eigentuemer-access]
verify_jwt = false

[functions.tasks-maintenance]
verify_jwt = false

[functions.process-scheduled-messages]
verify_jwt = false

# Drive im Eigentümerportal: Cron-Sweep (Service-Role) + Portal-Aufrufe mit
# User-JWT, den die Function selbst prüft. yt-oauth ist Googles Rücksprung-URL.
[functions.owner-drive]
verify_jwt = false

[functions.yt-oauth]
verify_jwt = false

[functions.masterclass-register]
verify_jwt = false

# YouTube-Center: In-Code-Guard (User-JWT gegen profiles/permissions, Service-Role erlaubt)
[functions.yt-center]
verify_jwt = false

# ── Sicherheits-Audit 30.9.2026 ──
# verify_jwt hier so festgeschrieben, wie die Functions heute live laufen, damit
# ein Deploy ohne Flag nichts umstellt. verify_jwt=true ist KEIN Schutz (der
# publishable Key besteht das Gateway), geschützt wird im Code (callerAuth/callerGate).

[functions.send-email]
verify_jwt = false

